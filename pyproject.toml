[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paios"
version = "0.1.0"
description = "Personal AI Operating System"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "PAIOS" }]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
paios = "paios.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/paios"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
